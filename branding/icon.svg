<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Icône du bouton de mini-carte : le logo simplifié pour rester lisible en tout petit.
       Le jeu la découpe en rond : tout le dessin tient dans le cercle central. -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#22262e"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <path d="M13 45 H23 V36 H32 V27 H41" fill="none" stroke="#f5ad38" stroke-opacity="0.45"
        stroke-width="7" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M13 45 H23 V36 H32 V27 H41" fill="none" stroke="#f5ad38"
        stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="46" cy="20" r="9" fill="#f5ad38" fill-opacity="0.45" filter="url(#glow)"/>
  <path d="M46 10 L48.9 17.1 L56 20 L48.9 22.9 L46 30 L43.1 22.9 L36 20 L43.1 17.1 Z"
        fill="#ffd27a" stroke="#f5ad38" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
